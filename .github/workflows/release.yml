name: Build and publish desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal · 中文
            platform: macos-latest
            locale: zh-CN
            args: "--target universal-apple-darwin --bundles dmg,app --config src-tauri/tauri.zh-CN.conf.json"
          - name: macOS universal · English
            platform: macos-latest
            locale: en
            args: "--target universal-apple-darwin --bundles dmg,app --config src-tauri/tauri.en.conf.json"
          - name: Windows x64 · 中文
            platform: windows-latest
            locale: zh-CN
            args: "--bundles nsis --config src-tauri/tauri.zh-CN.conf.json"
          - name: Windows x64 · English
            platform: windows-latest
            locale: en
            args: "--bundles nsis --config src-tauri/tauri.en.conf.json"
          - name: Linux x64 · 中文
            platform: ubuntu-22.04
            locale: zh-CN
            args: "--bundles appimage,deb --config src-tauri/tauri.zh-CN.conf.json"
          - name: Linux x64 · English
            platform: ubuntu-22.04
            locale: en
            args: "--bundles appimage,deb --config src-tauri/tauri.en.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DEFAULT_LOCALE: ${{ matrix.locale }}
          TAURI_BUNDLE_MACOS_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "SingRight 准唱 v__VERSION__"
          releaseBody: |
            SingRight v0.2.0 提供中文和 English 两套安装包，应用内可随时切换语言。Windows 安装器会根据系统语言自动选择，并提供安装语言选择器。

            - 实时麦克风音高检测
            - 宽松、标准、严格与 ±10–100 cents 自定义音准容差
            - 区分明确的逐音校准、实时连续跟唱、无干扰整曲复盘
            - 五线谱、简谱与对照视图，严格按拍号限制每小节容量
            - 键盘专用单声部录入：1–5 选时值，Q W E R T Y U I O P [ ] 输入十二音，方向键切换八度与固定槽位
            - 标准休止符字形与可选降号、调号、升号拼写
            - 全软件音名统一采用 C D E F G A B
            - 参考音频波形、裁剪、速度和拍点对齐
            - 合成音试听、节拍器、预备拍和小节循环
            - SingRight JSON、MusicXML 与 MIDI 格式互通
            - 曲谱、模板和录音使用系统原生“另存为”窗口
            - 录音上传分析和本地录音保存
            - 独立练习速度、移调、精确首音定调、A4 基准和容差设置

            中文用户请选择文件名含 `zh-CN` 的安装包；English users should choose an asset containing `en`.

            本版本尚未进行商业代码签名。首次打开时，系统可能要求你在安全设置中确认。
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
