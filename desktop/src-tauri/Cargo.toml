[package]
name = "singright"
version = "0.2.0"
description = "Cross-platform score editor and singing pitch trainer"
authors = ["polynomial1027"]
edition = "2021"

[lib]
name = "singright_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
